<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broadcast · Haruna Family</title>
  <style>
    :root { --ink:#17221f; --muted:#74817a; --paper:#fbfaf7; --card:#fff; --line:#dce4dd; --soft:#f7e2db; --green:#dcebe0; --accent:#3d7057; --danger:#a94f45; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 80% 5%,#f6ddd2 0,transparent 25%),var(--paper); font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .page { width:min(100% - 32px,620px); margin:auto; padding:30px 0 55px; } header { display:flex; align-items:center; justify-content:space-between; margin-bottom:38px; } .brand { color:var(--muted); font-size:.73rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } .brand span { color:#b56f5c; } .back { color:var(--muted); text-decoration:none; } .back:hover { color:var(--ink); }
    .intro { padding:27px 26px; border:1px solid #e4c4ba; border-radius:14px; background:linear-gradient(135deg,rgba(247,226,219,.72),rgba(255,255,255,.55)); } .eyebrow { margin:0 0 8px; color:var(--danger); font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:0; font:500 clamp(2.2rem,7vw,3.5rem)/1 Georgia,serif; letter-spacing:-.04em; } .intro p { margin:12px 0 0; max-width:460px; color:#776c68; }
    .compose { margin-top:22px; padding:17px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.8); } .compose textarea { width:100%; min-height:75px; resize:vertical; border:0; outline:0; background:transparent; color:var(--ink); font:15px/1.5 inherit; } .compose-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:9px; } .compose-hint { color:var(--muted); font-size:12px; } button { border:1px solid var(--ink); border-radius:999px; padding:9px 17px; background:var(--ink); color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; } button:hover { background:var(--accent); border-color:var(--accent); } button:disabled { opacity:.55; cursor:wait; }
    .feed { margin-top:22px; padding:4px 18px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:rgba(255,255,255,.55); } .broadcast { padding:21px 0; border-bottom:1px solid var(--line); } .broadcast:last-child { border-bottom:0; } .broadcast-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; } .author { display:flex; align-items:center; gap:9px; font-weight:700; } .avatar { display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--green); color:#47745a; font-size:12px; } time { color:var(--muted); font-size:12px; } .broadcast p { margin:0; color:#40504a; font-size:15px; line-height:1.55; white-space:pre-line; } .broadcast-actions { display:flex; justify-content:flex-end; margin-top:11px; } .delete { border:0; padding:0; background:none; color:var(--danger); font-size:12px; font-weight:600; } .delete:hover { border:0; background:none; color:#7c3029; } .state { padding:25px 0; color:var(--muted); text-align:center; } .note { margin:18px 0 0; color:var(--muted); font-size:12px; text-align:center; }
    @media (max-width:500px) { .page { width:min(100% - 24px,620px); padding-top:22px; } .intro { padding:23px 20px; } .feed { padding:4px 14px; } }
  </style>
</head>
<body>
  <main class="page">
    <header><div class="brand">Haruna <span>Family</span></div><a class="back" href="index.html">← Back home</a></header>
    <section class="intro"><p class="eyebrow">Family broadcast channel</p><h1>Broadcast</h1><p>Important updates for the Haruna family, shared in one calm and easy-to-find place.</p></section>
    <section class="compose" id="compose"><textarea id="post-content" rows="3" placeholder="Share an update with the family..."></textarea><div class="compose-footer"><span class="compose-hint" id="compose-hint">Posting as family member</span><button id="post-button" type="button">Broadcast</button></div></section>
    <section class="feed" id="feed" aria-label="Family broadcasts"><div class="state">Loading broadcasts…</div></section>
    <p class="note">Broadcasts are shared with the Haruna family.</p>
  </main>
  <script>
    const API_BASE = 'https://threads-api.aazzam.my.id';
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    const feed = document.getElementById('feed'); const composer = document.getElementById('compose'); const textarea = document.getElementById('post-content'); const button = document.getElementById('post-button');
    if (!token || !currentUser) composer.style.display = 'none';
    function escapeHtml(value) { const div = document.createElement('div'); div.textContent = value || ''; return div.innerHTML; }
    function authHeaders() { return { 'Content-Type':'application/json', Authorization:`Bearer ${token}` }; }
    function formatDate(value) { const date = value ? new Date(value) : new Date(); return Number.isNaN(date.getTime()) ? '' : date.toLocaleString([], { dateStyle:'medium', timeStyle:'short' }); }
    function renderPosts(posts) { feed.innerHTML = ''; if (!posts || posts.length === 0) { feed.innerHTML = '<div class="state">No broadcasts yet. Start the family conversation.</div>'; return; } posts.forEach(post => { const item = document.createElement('article'); item.className = 'broadcast'; const isAuthor = currentUser && currentUser.id === post.user_id; item.innerHTML = `<div class="broadcast-header"><div class="author"><span class="avatar">${escapeHtml((post.user_name || 'F').slice(0,1).toUpperCase())}</span><span>${escapeHtml(post.user_name || 'Family member')}</span></div><time>${escapeHtml(formatDate(post.created_at))}</time></div><p>${escapeHtml(post.content)}</p>${isAuthor ? '<div class="broadcast-actions"><button class="delete" type="button">Delete broadcast</button></div>' : ''}`; if (isAuthor) item.querySelector('.delete').addEventListener('click', () => deletePost(post.id)); feed.appendChild(item); }); }
    async function loadPosts() { try { const response = await fetch(`${API_BASE}/posts`, { headers: token ? authHeaders() : {} }); if (!response.ok) throw new Error(await response.text()); renderPosts(await response.json()); } catch (error) { feed.innerHTML = '<div class="state">Unable to load broadcasts right now.</div>'; console.error(error); } }
    async function createPost() { const content = textarea.value.trim(); if (!content || !token) return; button.disabled = true; try { const response = await fetch(`${API_BASE}/posts`, { method:'POST', headers:authHeaders(), body:JSON.stringify({ content, parent_post_id:null }) }); if (!response.ok) throw new Error(await response.text()); textarea.value = ''; await loadPosts(); } catch (error) { alert('Unable to publish this broadcast.'); console.error(error); } finally { button.disabled = false; } }
    async function deletePost(id) { if (!confirm('Delete this broadcast?')) return; try { const response = await fetch(`${API_BASE}/posts/delete?id=${encodeURIComponent(id)}`, { method:'DELETE', headers:authHeaders() }); if (!response.ok) throw new Error(await response.text()); await loadPosts(); } catch (error) { alert('Unable to delete this broadcast.'); console.error(error); } }
    button.addEventListener('click', createPost); textarea.addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') createPost(); }); loadPosts();
  </script>
  <script>if (sessionStorage.getItem('haruna-authenticated') !== 'true') window.location.replace('index.html');</script>
</body>
</html>
